name: docker-publish

# 发布面流水线（Docker Hub：davyang/sticky-note）
# 触发：
#   push tag v*   → 正式发版，三标签：<版本> / <主.次> / latest（3 秒上手与钉版消费并存）
#   手动 dispatch  → 演练频道，推 edge 标签（不影响正式标签，验证管道用）
# 双架构 linux/amd64 + linux/arm64；构建产物必须通过「容器实启 + /api/health 200」冒烟 gate。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 解析版本与标签组
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
            MM="$(echo "$V" | grep -oE '^[0-9]+\.[0-9]+')"
            if [[ -z "$V" || -z "$MM" ]]; then
              echo "❌ 非法 tag 格式 $GITHUB_REF_NAME（应为 v<语义版本>）"; exit 1
            fi
            echo "tags=davyang/sticky-note:${V},davyang/sticky-note:${MM},davyang/sticky-note:latest" >> "$GITHUB_OUTPUT"
          else
            V="edge"
            echo "tags=davyang/sticky-note:edge" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 凭据自检（不输出任何值，仅校验长度与非法字符）
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          [[ "$U" =~ ^[a-z0-9][a-z0-9_-]{2,}$ ]] || { echo "❌ USERNAME 格式异常（应仅小写字母数字/连字符）"; exit 1; }
          [[ ${#T} -ge 40 && ${#T} -le 256 ]] || { echo "❌ TOKEN 长度异常（${#T} 字符，应在 40~256：疑似粘贴带空白/截断）"; exit 1; }
          [[ "$T" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "❌ TOKEN 含空白或非法字符（疑似复制时带空格/换行）"; exit 1; }
          echo "✅ 凭据自检通过（token ${#T} 字符）"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器实启冒烟（amd64 实启 + /api/health 200）
        run: |
          docker run -d --name sn-smoke -p 13389:13389 "davyang/sticky-note:${{ steps.meta.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:13389/api/health; then
              echo; echo "✅ 容器冒烟通过（health 200）"; exit 0
            fi
            sleep 2
          done
          echo "❌ 容器冒烟失败，容器日志如下："
          docker logs sn-smoke
          exit 1