name: docker-publish

# 发布面流水线（Docker Hub：davyang/sticky-note）
# 触发：
#   push tag v*   → 正式发版，三标签：<版本> / <主.次> / latest（3 秒上手与钉版消费并存）
#   手动 dispatch  → 演练频道，推 edge 标签（不影响正式标签，验证管道用）
# 双架构 linux/amd64 + linux/arm64；构建产物必须通过「容器实启 + /api/health 200」冒烟 gate。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（如 2.6.0）；留空 = edge 演练"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 解析版本与标签组
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "非法 tag $GITHUB_REF_NAME（应为 vX.Y.Z）"; exit 1;
            }
            V="${GITHUB_REF_NAME#v}"
            MM="${V%.*}"
          else
            V="${{ inputs.version }}"
            if [[ -n "$V" && "$V" != "edge" ]]; then
              [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "非法版本 $V（应为 X.Y.Z）"; exit 1;
              }
              MM="${V%.*}"
            else
              V="edge"
              MM=""
            fi
          fi
          # 正式版本必须唯一对应仓内 VERSION；edge 仅用于演练，不发布 latest。
          if [[ "$V" != "edge" ]]; then
            [[ "$V" == "$(cat VERSION)" ]] || {
              echo "发布版本 $V 与 VERSION($(cat VERSION)) 不一致"; exit 1;
            }
            echo "tags=davyang/sticky-note:${V},davyang/sticky-note:${MM},davyang/sticky-note:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=davyang/sticky-note:edge" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 正式版本同提交 CI 成功门禁
        if: steps.meta.outputs.version != 'edge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ok="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq '.total_count')"
          [[ "$ok" =~ ^[0-9]+$ && "$ok" -ge 1 ]] || {
            echo "当前提交没有成功的 CI 运行，禁止发布正式镜像"; exit 1;
          }

      - name: 凭据自检（不输出任何值，仅校验长度与非法字符）
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          [[ "$U" =~ ^[a-z0-9][a-z0-9_-]{2,}$ ]] || { echo "❌ USERNAME 格式异常（应仅小写字母数字/连字符）"; exit 1; }
          [[ ${#T} -ge 20 && ${#T} -le 256 ]] || { echo "❌ TOKEN 长度异常（${#T} 字符，应在 20~256：疑似粘贴带空白/截断）"; exit 1; }
          [[ "$T" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "❌ TOKEN 含空白或非法字符（疑似复制时带空格/换行）"; exit 1; }
          echo "✅ 凭据自检通过（token ${#T} 字符）"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建 amd64 候选镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
          tags: davyang/sticky-note:candidate-${{ github.sha }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: amd64 候选容器实启
        run: bash scripts/docker-smoke.sh davyang/sticky-note:candidate-${{ github.sha }}-amd64 linux/amd64 "${{ steps.meta.outputs.version }}"

      - name: 构建 arm64 候选镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
          tags: davyang/sticky-note:candidate-${{ github.sha }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: arm64 候选容器实启（QEMU）
        run: bash scripts/docker-smoke.sh davyang/sticky-note:candidate-${{ github.sha }}-arm64 linux/arm64 "${{ steps.meta.outputs.version }}"

      - name: 双架构验证通过后构建并推送正式多架构镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64